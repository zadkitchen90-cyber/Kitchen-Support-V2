<div class="page">

    <div class="page-header">

        <div>
<h2>🛠 الصيانة</h2>
<p>إدارة جميع أعمال الصيانة</p>    
    </div>

        <button class="add-btn" onclick="showAddService()">
            ➕ صيانة جديدة
        </button>

    </div>

    <div class="stats-row">

        <div class="stat-card blue">
            <div class="stat-number" id="totalServicesCount">0</div>
            <div class="stat-title">إجمالي الصيانات</div>
        </div>

        <div class="stat-card orange">
            <div class="stat-number" id="openServicesCount">0</div>
            <div class="stat-title">صيانات مفتوحة </div>
        </div>

        <div class="stat-card green">
            <div class="stat-number" id="completedServicesCount">0</div>
            <div class="stat-title">تم التنفيذ</div>
        </div>

        <div class="stat-card red">
            <div class="stat-number" id="cancelledServicesCount">0</div>
            <div class="stat-title">ملغية</div>
        </div>

    </div>

    <div class="dashboard-section">

<div class="table-toolbar">

    <div class="toolbar-left">

        <input
            id="serviceSearch"
            class="search-input"
            type="text"
            placeholder="🔍 ابحث باسم العميل أو الهاتف أو المطبخ..."
            onkeyup="searchServices()">

    </div>

    <div class="toolbar-right">

        <select id="statusFilter" onchange="searchServices()">
            <option value="">📋 كل الحالات</option>
            <option value="جديد">🟡 جديد</option>
            <option value="جارى التنفيذ">🟠 جاري التنفيذ</option>
            <option value="مكتمل">🟢 مكتمل</option>
            <option value="ملغي">🔴 ملغي</option>
        </select>

        <select id="priorityFilter" onchange="searchServices()">
            <option value="">⚡ كل الأولويات</option>
            <option value="عاجلة">🔴 عاجلة</option>
            <option value="متوسطة">🟠 متوسطة</option>
            <option value="عادية">🟢 عادية</option>
        </select>

        <button class="refresh-btn" onclick="loadServices()">
            🔄 تحديث
        </button>

    </div>

</div>
        <div class="table-responsive">

            <table>

                <thead>

                    <tr>

                        <th>#</th>
                        <th>اسم العميل</th>
                        <th>الهاتف</th>
                        <th>المطبخ</th>
                        <th>المهندس</th>
                        <th>نوع الصيانه </th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>

                    </tr>

                </thead>

                <tbody id="servicesTable">

                    <tr>

                        <td colspan="8" style="text-align:center;padding:40px">

                            جارٍ تحميل البيانات...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

loadServices();

</script>
