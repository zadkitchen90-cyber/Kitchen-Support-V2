<div class="dashboard">

    <div class="welcome-card">
        <div>
            <h2>
                <span id="greetingText">صباح الخير</span> 👋
                <span id="userName">...</span>
            </h2>
            <p>
                أهلاً بك في نظام
                <b>ZAD Kitchen Support V2</b>
            </p>
        </div>
        <div class="today-box">
            <div id="currentDateTime"></div>
        </div>
    </div>

    <!-- البطاقات الإحصائية (مع إضافة onclick والـ IDs الصحيحة بدون تكرار) -->
    <div class="stats-grid">
        <div class="stat-card" onclick="loadPage('Services')" style="cursor:pointer">
            <div class="icon">🛠</div>
            <div>
                <h3 id="totalServices">0</h3>
                <span>إجمالي البلاغات</span>
            </div>
        </div>

        <div class="stat-card" onclick="loadPage('Services')" style="cursor:pointer">
            <div class="icon">📂</div>
            <div>
                <h3 id="openServices">0</h3>
                <span>بلاغات مفتوحة</span>
            </div>
        </div>

        <div class="stat-card" onclick="loadPage('Engineers')" style="cursor:pointer">
            <div class="icon">👨‍🔧</div>
            <div>
                <h3 id="engineersCount">0</h3>
                <span>المهندسين</span>
            </div>
        </div>

        <div class="stat-card" onclick="loadPage('Services')" style="cursor:pointer">
            <div class="icon">📅</div>
            <div>
                <h3 id="todayVisits">0</h3>
                <span>زيارات اليوم</span>
            </div>
        </div>
    </div>

    <!-- جدول آخر الصيانات -->
    <div class="dashboard-section">
        <div class="section-title">
            آخر الصيانات
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>رقم البلاغ</th>
                    <th>العميل</th>
                    <th>المهندس</th>
                    <th>الحالة</th>
                    <th>موعد الزيارة</th>
                </tr>
            </thead>
            <!-- تم توحيد الـ ID ليوافق الكود البرمجي -->
            <tbody id="recentServicesTable">
                <tr>
                    <td colspan="5" style="text-align:center">
                        لا توجد بيانات
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
